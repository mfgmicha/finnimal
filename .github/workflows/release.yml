name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create theme zip
        run: tar czf finnimal.zip parts patterns templates functions.php README.md style.css theme.json
      - uses: softprops/action-gh-release@v2
        with:
          files: finnimal.zip
